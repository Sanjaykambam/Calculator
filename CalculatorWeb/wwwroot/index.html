<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calculator Web - Static</title>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
    <div class="calculator">
        <h1>Calculator (interactive)</h1>
        <div class="row">
            <label for="op">Operation</label>
            <select id="op">
                <option value="add">Add (+)</option>
                <option value="sub">Subtract (-)</option>
                <option value="mul">Multiply (*)</option>
                <option value="div">Divide (/)</option>
            </select>
        </div>
        <div class="row">
            <label for="a">Operand A</label>
            <input id="a" type="text" placeholder="Enter number" />
        </div>
        <div class="row">
            <label for="b">Operand B</label>
            <input id="b" type="text" placeholder="Enter number" />
        </div>
        <div class="row">
            <button id="compute">Compute</button>
            <button id="clear">Clear</button>
        </div>
        <div id="message" class="message"></div>
        <div id="result" class="result"></div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
